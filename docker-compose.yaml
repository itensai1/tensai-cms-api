services:
  postgres:
    image: postgres:latest
    container_name: tensai-cms-db
    environment:
      POSTGRES_DB: tensaicms
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cms_user
      MINIO_ROOT_PASSWORD: cms_password
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data

    # Auto-creates the bucket so you don't have to do it manually
  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 cms_user cms_password;
      /usr/bin/mc mb myminio/cms-media-bucket;
      exit 0;
      "
volumes:
  postgres_data:
  minio_data: