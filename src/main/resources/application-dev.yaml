spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tensaicms
    username: cms_user
    password: cms_password

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

security:
  allowed-origins: [ "*" ]
  telegram-header: "X-Internal-Secret"
  jwt-secret: ${JWT_SECRET}
  base-url: "http://localhost:8080"
  reset-password-path: "${security.base-url}/api/v1/auth/reset-password"

storage:
  s3:
    endpoint: "http://localhost:9000"
    access-key: "cms_user"
    secret-key: "cms_password"
    region: "us-east-1" # MinIO defaults to us-east-1
    bucket: "cms-media-bucket"