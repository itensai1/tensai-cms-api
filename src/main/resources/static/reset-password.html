<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Alpine.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
</head>
<body>

<div
        x-data="resetPasswordForm()"
        class="container"
>
    <header>
        <h1>Reset Password</h1>
        <p>Enter your new password below.</p>
    </header>

    <main>
        <!-- Error / Success messages -->
        <div
                x-show="message"
                class="callout"
                :class="messageClass"
                style="display:none;"
        >
            <strong x-text="messageTitle"></strong>
            <p x-text="message"></p>
        </div>

        <!-- Form -->
        <form @submit.prevent="submitForm" class="reset-form">
            <div class="form-group">
                <label for="password">New password</label>
                <input
                        id="password"
                        type="password"
                        x-model="password"
                        placeholder="Enter new password"
                        required
                />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input
                        id="confirmPassword"
                        type="password"
                        x-model="confirmPassword"
                        placeholder="Confirm new password"
                        required
                />
            </div>

            <button type="submit" :disabled="loading" class="btn-primary">
                <span x-text="loading ? 'Resetting…' : 'Reset password'"></span>
            </button>
        </form>
    </main>

    <footer>
        <p class="text-muted">This page is stateless; do not share this link.</p>
    </footer>
</div>

<script>
    function resetPasswordForm() {
        return {
            token: '',
            password: '',
            confirmPassword: '',
            loading: false,
            message: '',
            messageType: '', // 'success' | 'error'

            get messageClass() {
                return this.messageType === 'success' ? 'success' : 'warning';
            },

            get messageTitle() {
                return this.messageType === 'success' ? 'Success' : 'Error';
            },

            init() {
                const urlParams = new URLSearchParams(window.location.search);
                this.token = urlParams.get('token') || '';
                if (!this.token) {
                    this.messageType = 'error';
                    this.message = 'Missing or invalid reset token in the URL.';
                }
            },

            async submitForm() {
                this.message = '';
                this.messageType = '';

                if (!this.password || !this.confirmPassword) {
                    this.messageType = 'error';
                    this.message = 'Both password fields are required.';
                    return;
                }

                if (this.password !== this.confirmPassword) {
                    this.messageType = 'error';
                    this.message = 'Passwords do not match.';
                    return;
                }

                this.loading = true;

                try {
                    if (!this.token) {
                        this.message = "Missing or invalid reset token in the URL."
                        return;
                    }
                    const res = await fetch(`/api/v1/auth/reset-password?token=${encodeURIComponent(this.token)}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({password: this.password})
                    });

                    // Try to parse JSON body
                    let data = null;
                    const contentType = res.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        data = await res.json();
                    }

                    if (!res.ok) {
                        let errorMsg = 'Failed to reset password.';

                        if (data && Array.isArray(data.messages) && data.messages.length > 0) {
                            errorMsg = data.messages.join(' ');
                        } else if (data && typeof data.message === 'string') {
                            errorMsg = data.message;
                        } else if (data && typeof data.error === 'string') {
                            errorMsg = data.error;
                        }

                        this.messageType = 'error';
                        this.message = errorMsg;
                        return;
                    }

                    this.messageType = 'success';
                    this.message = 'Your password has been reset successfully.';
                    this.password = '';
                    this.confirmPassword = '';
                } catch (err) {
                    this.messageType = 'error';
                    this.message = err.message || 'An unexpected error occurred.';
                } finally {
                    this.loading = false;
                }
            }
        }
    }
</script>

</body>
</html>
